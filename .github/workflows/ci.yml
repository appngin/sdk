name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint OpenAPI contract
        run: bun run contract:lint
      - name: Build SDK
        run: bun run build
      - name: Test SDK
        run: bun run test
      - name: Verify generated source is committed
        run: git diff --exit-code -- src/generated
