name: Release SDKs

on:
  repository_dispatch:
    types: [api-release]
  workflow_dispatch:
    inputs:
      api_version:
        description: API/SDK version to release
        required: true
        type: string
      openapi_url:
        description: OpenAPI contract URL
        required: true
        default: https://api.appngin.com/v1/openapi.json
        type: string
      api_discovery_url:
        description: API discovery URL used to verify the deployed version
        required: true
        default: https://api.appngin.com/v1
        type: string
      openapi_sha256:
        description: Canonical SHA-256 of the OpenAPI contract
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  typescript:
    name: Release TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve release metadata
        id: metadata
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.api_version }}
          DISPATCH_URL: ${{ github.event.client_payload.openapi_url }}
          DISPATCH_DISCOVERY_URL: ${{ github.event.client_payload.api_discovery_url }}
          DISPATCH_SHA256: ${{ github.event.client_payload.openapi_sha256 }}
          INPUT_VERSION: ${{ inputs.api_version }}
          INPUT_URL: ${{ inputs.openapi_url }}
          INPUT_DISCOVERY_URL: ${{ inputs.api_discovery_url }}
          INPUT_SHA256: ${{ inputs.openapi_sha256 }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            api_version="$DISPATCH_VERSION"
            openapi_url="$DISPATCH_URL"
            api_discovery_url="$DISPATCH_DISCOVERY_URL"
            openapi_sha256="$DISPATCH_SHA256"
          else
            api_version="$INPUT_VERSION"
            openapi_url="$INPUT_URL"
            api_discovery_url="$INPUT_DISCOVERY_URL"
            openapi_sha256="$INPUT_SHA256"
          fi
          [[ -n "$api_version" && -n "$openapi_url" && -n "$api_discovery_url" && -n "$openapi_sha256" ]] || {
            echo "Release metadata is incomplete" >&2
            exit 1
          }
          echo "api_version=$api_version" >> "$GITHUB_OUTPUT"
          echo "openapi_url=$openapi_url" >> "$GITHUB_OUTPUT"
          echo "api_discovery_url=$api_discovery_url" >> "$GITHUB_OUTPUT"
          echo "openapi_sha256=$openapi_sha256" >> "$GITHUB_OUTPUT"
      - name: Fetch and verify API contract
        env:
          API_VERSION: ${{ steps.metadata.outputs.api_version }}
          OPENAPI_URL: ${{ steps.metadata.outputs.openapi_url }}
          API_DISCOVERY_URL: ${{ steps.metadata.outputs.api_discovery_url }}
          OPENAPI_SHA256: ${{ steps.metadata.outputs.openapi_sha256 }}
        run: bun run contract:fetch
      - name: Set SDK package version
        env:
          API_VERSION: ${{ steps.metadata.outputs.api_version }}
        run: bun run version:set
      - name: Lint OpenAPI contract
        run: bun run contract:lint
      - name: Build SDK
        run: bun run build
      - name: Test SDK
        run: bun run test
      - name: Test built package exports
        run: bun run test:package
      - name: Verify generated source
        run: git diff --exit-code -- src/generated
      - name: Check existing release state
        id: existing
        env:
          API_VERSION: ${{ steps.metadata.outputs.api_version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${API_VERSION}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Git tag v${API_VERSION} already exists."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@appnginhq/sdk@${API_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
            echo "@appnginhq/sdk@${API_VERSION} already exists on npm."
          else
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit contract and generated SDK
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          API_VERSION: ${{ steps.metadata.outputs.api_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../spec/openapi.json src/generated package.json
          if git diff --cached --quiet; then
            echo "Contract and generated source are already current."
          else
            git commit -m "chore: release TypeScript SDK v${API_VERSION}"
          fi
      - name: Push release commit and tag
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          API_VERSION: ${{ steps.metadata.outputs.api_version }}
        run: |
          git push origin HEAD:main
          git tag "v${API_VERSION}"
          git push origin "v${API_VERSION}"
      - name: Publish TypeScript package
        if: steps.existing.outputs.package_exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
